# CI slim-Dapr pub/sub — mirrors app/backend-ts/dapr/components/redis-pubsub.yaml
# but points at the CI Redis service. `__REDIS_HOST__` is substituted by
# `make ci-dapr-up`. Without this component the
# `todo.pubsub.integration.test.ts` publish test skip-guards to green instead
# of exercising a real Redis-backed publish through the sidecar.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: redis-pubsub
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      value: __REDIS_HOST__
    - name: consumerID
      value: '{appID}'
    - name: maxLenApprox
      value: 1000

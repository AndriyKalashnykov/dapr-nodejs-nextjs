name: Cleanup old workflow runs

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: cleanup-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read # cleanup-caches: gh api repos/.../branches (silently no-ops without it on private repos)
  actions: write # gh run delete / gh cache delete
  pull-requests: read # exclude open-PR head-SHA runs from deletion

jobs:
  cleanup-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RETAIN_DAYS: 7
      KEEP_MINIMUM: 5
    steps:
      - name: Delete old workflow runs
        run: |
          CUTOFF=$(date -u -d "${RETAIN_DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)
          # Never delete a run carrying an OPEN PR's head-SHA — that run holds the
          # PR's required `ci-pass` check; deleting it leaves the PR BLOCKED with
          # 0 checks reported (silently un-mergeable).
          OPEN_SHAS=$(gh pr list --repo "${{ github.repository }}" --state open \
            --json headRefOid --jq '[.[].headRefOid]')
          # Keep KEEP_MINIMUM newest runs PER WORKFLOW (group_by), not globally —
          # a global slice can delete a low-frequency workflow's last run and
          # deregister it from required-check resolution during quiet periods.
          gh run list --repo "${{ github.repository }}" \
            --json databaseId,createdAt,workflowName,headSha --limit 200 \
          | jq -r --arg cutoff "$CUTOFF" --argjson keep "$KEEP_MINIMUM" --argjson open "$OPEN_SHAS" \
            'group_by(.workflowName)
             | map(sort_by(.createdAt) | reverse | .[$keep:])
             | add // []
             | .[]
             | select(.createdAt < $cutoff)
             | select(.headSha as $s | ($open | index($s)) | not)
             | .databaseId' \
          | xargs -r -I{} gh run delete {} --repo "${{ github.repository }}"

  cleanup-caches:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete caches from merged or deleted branches
        run: |
          echo "=== Cleaning caches from non-existent branches ==="
          gh cache list --repo "${{ github.repository }}" --json id,ref,key --limit 200 \
          | jq -r '.[] | "\(.id)\t\(.ref)\t\(.key)"' \
          | while IFS=$'\t' read -r id ref key; do
              branch="${ref#refs/heads/}"
              # Keep caches for main and tags
              if [ "$branch" = "main" ] || [[ "$ref" == refs/tags/* ]]; then
                continue
              fi
              # Check if branch still exists; delete cache if gone
              if ! gh api "repos/${{ github.repository }}/branches/${branch}" --silent 2>/dev/null; then
                echo "Deleting cache ${key} (branch ${branch} no longer exists)"
                gh cache delete "$id" --repo "${{ github.repository }}" 2>/dev/null || true
              fi
            done

name: Main rot detection

# Detects rot on `main` that only surfaces when CI runs (vulncheck advisories
# landing for unchanged lockfiles, latent runtime regressions in unchanged
# Dockerfiles, etc.). Without this, the project's CI workflow (`ci.yml`)
# fires only on `pull_request` / push-to-main / tag pushes — main itself
# can rot for weeks while every queued PR fails on the inherited problem
# and nobody notices because the root cause looks like a per-PR issue.
#
# Root cause history: between 2026-05-02 (last green main) and 2026-05-13,
# upstream advisories for `next` and `protobufjs` plus a latent corepack
# trap in the backend-ts Dockerfile blocked 16 consecutive Renovate PRs.
# This workflow makes that decay visible within ~24h.

on:
  schedule:
    # 07:00 UTC daily — early enough that morning standups see the result.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CONTAINER_CMD: docker

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Set up mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          install: true
          cache: true

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # cve-check is NOT part of the PR/push static-check (CVE scanning is
      # tag-gated); main-rot runs it daily so vuln-advisory decay on `main`
      # (a new CVE against an unchanged dep) still surfaces within 24h.
      - name: Static check + CVE scan
        run: make static-check cve-check

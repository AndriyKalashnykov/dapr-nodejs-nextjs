name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Force CONTAINER_CMD=docker for every job. ubuntu-latest runners ship with
# podman BEFORE docker on PATH, so the Makefile's
# `command -v podman 2>/dev/null || echo docker` picks podman, which tags
# images with a `localhost/` prefix that the docker daemon (used by
# trivy-action, our smoke test, and `docker compose` in the e2e job)
# cannot see. Fix at the workflow level so every job inherits.
env:
  CONTAINER_CMD: docker

jobs:
  # ── Path filter ────────────────────────────────────────────────────────────
  # Detect whether the change touches code (vs. docs-only). Heavy jobs gate on
  # `needs.changes.outputs.code == 'true'` so doc-only PRs skip the build/test
  # matrix entirely while still passing the `ci-pass` gate (Repository Rulesets
  # require the workflow to RUN, not just to be skipped — see `/ci-workflow`
  # skill, "Path-Filter Strategy"). Tag pushes always fall through (release).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Canonical negated-extglob form (per /ci-workflow skill §"Path-Filter
      # Strategy"): a single negative pattern matches everything that ISN'T
      # docs/assets, then `CLAUDE.md` is re-included as a positive pattern
      # since it conventionally trips heavy jobs (agent guidance changes).
      - name: Detect code changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          # `base:` is required when the event has no `repository.default_branch`
          # (e.g., `act push` for `make ci-run`). On real PR events the input is
          # ignored — set it empty so the action doesn't emit the "input ignored"
          # annotation. See /ci-workflow skill §15e.
          base: ${{ github.event_name == 'push' && 'main' || '' }}
          filters: |
            code:
              - '!(**.md|docs/**|specs/**|LICENSE|.gitignore|.claudeignore|.claude/**|benchmarks/**|**.png|**.jpg|**.gif|**.svg)'
              - 'CLAUDE.md'
              # C4 diagram sources are docs-classified above but are gated by
              # `make diagrams-check` inside static-check — re-include so a
              # .puml-only edit runs the drift gate (else a stale/broken PNG
              # merges green).
              - 'docs/diagrams/**/*.puml'
            # Markdown-only changes: run the cheap `mermaid-lint` job so a
            # README diagram break is caught without triggering the full build.
            docs:
              - '**/*.md'

  # ── Build (SDK compile + lint + test → upload artifact) ────────────────────
  build:
    needs: [changes]
    if: ${{ !failure() && !cancelled() && (needs.changes.outputs.code == 'true' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          cache: true

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Build
        run: make sdk-ci

      - name: Upload SDK build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        continue-on-error: true
        with:
          name: sdk-build
          path: packages/@sos/sdk/build
          retention-days: 1

  # ── Static check (offline PR gate; CVE scans are tag-gated, see cve-check) ─
  # Runs in parallel with `build` — `make static-check` invokes the lint
  # target which has `sdk-compile` as a prerequisite, so this job compiles
  # the SDK itself rather than downloading the `build` job's artifact.
  static-check:
    needs: [changes]
    if: ${{ !failure() && !cancelled() && (needs.changes.outputs.code == 'true' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          cache: true

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Static check
        run: make static-check

  # ── Unit tests (backend) ───────────────────────────────────────────────────
  test:
    needs: [changes, build]
    if: ${{ !failure() && !cancelled() && (needs.changes.outputs.code == 'true' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          cache: true

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Download SDK build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        # continue-on-error: act's local artifact server panics under load
        # (`http: panic serving: open /tmp/.../1: no such file or directory`).
        # Real GitHub Actions artifact storage is reliable, so this flag is a
        # no-op there. Under act, the next step's Makefile target falls back
        # to `make sdk-compile` if the artifact didn't materialise.
        continue-on-error: true
        with:
          name: sdk-build
          path: packages/@sos/sdk/build

      - name: Test
        run: make backend-test
        env:
          SERVICE_NAME: backend-ts

  # ── Integration tests (backend + Postgres + Dapr sidecar) ──────────────────
  integration-test:
    needs: [changes, build]
    if: ${{ !failure() && !cancelled() && (needs.changes.outputs.code == 'true' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Redis backs the redis-state + redis-pubsub Dapr components so the
      # cache/pub-sub integration tests actually execute (they skip-guard to
      # green without a reachable Redis-backed component).
      redis:
        image: redis:8-alpine@sha256:8096655e437712b07503796fb64d81359256cfcff0ab29d95a7da72863786efb
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          cache: true

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Download SDK build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        # continue-on-error: act's local artifact server panics under load
        # (`http: panic serving: open /tmp/.../1: no such file or directory`).
        # Real GitHub Actions artifact storage is reliable, so this flag is a
        # no-op there. Under act, the next step's Makefile target falls back
        # to `make sdk-compile` if the artifact didn't materialise.
        continue-on-error: true
        with:
          name: sdk-build
          path: packages/@sos/sdk/build

      - name: Bring up Dapr sidecar
        run: make ci-dapr-up
        env:
          REDIS_HOST: localhost:6379

      - name: Prepare test schema
        run: make ci-db-prepare

      - name: Integration test
        run: make backend-test-integration
        env:
          NODE_ENV: test
          SERVICE_NAME: backend-ts
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: postgres
          DB_SCHEMA: backend_ts
          JWT_SECRET_KEY: secret
          DAPR_HOST: localhost
          DAPR_PORT: "3500"

  # ── Web (Next.js lint + test + production build) ───────────────────────────
  # Doesn't depend on @sos/sdk so no artifact download — runs parallel with build.
  web-nextjs:
    needs: [changes]
    if: ${{ !failure() && !cancelled() && (needs.changes.outputs.code == 'true' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          cache: true

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Lint, test and build
        run: make web-nextjs-ci

  # ── E2E (full stack via docker compose) ────────────────────────────────────
  e2e:
    needs: [changes, integration-test, web-nextjs]
    # Tag-only (release-only), same predicate as cve-check/docker. This job is a
    # kitchen sink: besides the compose smoke test it also runs
    # web-nextjs-integration (full Next→Dapr→backend→Postgres chain), the
    # Playwright browser e2e, and the OWASP ZAP DAST scan — all of which now run
    # ONLY at release tags (no per-PR/main coverage; main-rot does NOT run them).
    # ci-pass stays green on PRs because a skipped job is neither failure nor
    # cancelled (identical to cve-check/docker). Deliberate trade-off; see CLAUDE.md.
    if: ${{ !failure() && !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          cache: true

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Download SDK build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        # continue-on-error: act's local artifact server panics under load
        # (`http: panic serving: open /tmp/.../1: no such file or directory`).
        # Real GitHub Actions artifact storage is reliable, so this flag is a
        # no-op there. Under act, the next step's Makefile target falls back
        # to `make sdk-compile` if the artifact didn't materialise.
        continue-on-error: true
        with:
          name: sdk-build
          path: packages/@sos/sdk/build

      # No `make install` needed — e2e-test.sh forges JWTs via openssl,
      # so the runner doesn't need workspace pnpm deps. The compose images
      # have their own node_modules baked in.
      - name: Build base images
        run: make setup

      - name: Build service images
        run: make build

      - name: Start stack
        run: docker compose up -d

      - name: Run end-to-end tests
        run: bash e2e/e2e-test.sh

      # Next.js route → real Dapr → real backend → real Postgres, against the
      # running compose stack (skip-guards to green if the stack isn't up —
      # e2e-test.sh above has already confirmed readiness, so it executes here).
      - name: web-nextjs integration (full chain)
        run: make web-nextjs-integration

      # Playwright browser e2e against the running stack (SSR DOM round-trip).
      # Wired here so it can't silently rot outside CI.
      - name: Playwright browser e2e
        run: make e2e-browser

      # DAST gate (OWASP ZAP baseline) — runs against the same compose stack
      # rather than a separate runner image. ZAP version is pinned in the
      # Makefile (ZAP_VERSION constant); `-I` makes the scan warn-only on WARN
      # findings, blocking only on FAIL severity. Report uploaded as artifact.
      - name: DAST scan
        if: ${{ vars.ACT != 'true' }}
        run: make dast

      - name: Upload DAST report
        if: ${{ always() && vars.ACT != 'true' }}
        # A transient artifact-service error on this post-gate diagnostic upload
        # must not red an otherwise-green e2e job (and, on push-to-main, main).
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zap-baseline-report
          path: zap-output/
          retention-days: 30
          if-no-files-found: ignore

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down stack
        if: always()
        run: docker compose down -v

  # ── CVE scans (tag-gated) ──────────────────────────────────────────────────
  # Per policy, ALL CVE scanning (pnpm audit + Trivy filesystem) runs ONLY on
  # tag pushes — PRs skip it for speed. Daily coverage of `main` is provided by
  # main-rot.yml (which runs `make static-check cve-check`).
  cve-check:
    needs: [changes]
    if: ${{ !failure() && !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          cache: true

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: CVE scans (pnpm audit + Trivy filesystem)
        run: make cve-check

  # ── Docker (tag-gated GHCR publish + full supply-chain hardening) ──────────
  # Runs ONLY on tag pushes. Per service (amd64 — ACA, the deploy target, runs
  # amd64): build → Trivy IMAGE scan → container-structure-test → smoke → push
  # to GHCR → cosign keyless sign → SBOM + SLSA provenance attestations. The
  # build-push keeps provenance/sbom FALSE so the image index has no
  # unknown/unknown entries (GHCR "OS / Arch" tab renders); SBOM + provenance
  # are attached as referrer attestations instead.
  docker:
    needs: [changes, static-check, build, test, cve-check]
    if: ${{ !failure() && !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to GHCR via GITHUB_TOKEN
      id-token: write # cosign keyless OIDC + attestations
      attestations: write # SBOM + provenance attestations
    strategy:
      fail-fast: false
      matrix:
        service: [backend-ts, web-nextjs]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # github.repository preserves account casing; image refs must be lowercase.
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.service }}" >> "$GITHUB_ENV"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: |
            latest=true

      # Gate 1 — amd64 load for scanning + structure/smoke testing.
      - name: Build image for scan
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: app/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ matrix.service }}:scan
          build-args: |
            APK_UPGRADE_DATE=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Gate 2 — Trivy IMAGE scan (CRITICAL/HIGH blocking).
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.service }}:scan
          scanners: "vuln,secret,misconfig"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: ./.trivyignore.yaml

      # Gate 3 — Dockerfile-contract assertions (USER, port, entrypoint).
      - name: Container structure test
        run: make image-test
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: scan

      # Gate 4 — boot the image and grep logs for a known startup marker.
      - name: Smoke test
        run: make image-smoke-test
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: scan

      # All gates passed → publish to GHCR.
      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: app/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false # keep image index free of unknown/unknown entries so GHCR "OS / Arch" renders
          sbom: false # SBOM attached below as a referrer attestation instead
          build-args: |
            APK_UPGRADE_DATE=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Post-push — cosign keyless OIDC signing by digest.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "→ cosign sign ${tag}@${DIGEST}"
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "${TAGS}"

      # SBOM (SPDX) generated from the LOCAL :scan image (already in the daemon
      # from the load:true build) — avoids pulling the just-pushed image, which
      # is private on a first personal-account publish. Attached by pushed digest.
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ matrix.service }}:scan
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom-${{ matrix.service }}.spdx.json
          push-to-registry: true

      # SLSA build provenance attestation (referrer-based, not in-manifest).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # ── Gate ───────────────────────────────────────────────────────────────────
  # ── Mermaid lint (docs-only fast path) ─────────────────────────────────────
  # A markdown-only change skips every `code`-gated job (static-check included),
  # so the mermaid diagrams in README.md / CLAUDE.md would merge unvalidated.
  # This cheap job runs `make mermaid-lint` for docs-only changes. When `code`
  # is true, static-check already runs mermaid-lint, so this job stays skipped.
  mermaid-lint:
    needs: [changes]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code != 'true' && needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          cache: true

      - name: Mermaid lint
        run: make mermaid-lint

  ci-pass:
    if: always()
    needs:
      [
        changes,
        build,
        static-check,
        test,
        integration-test,
        web-nextjs,
        e2e,
        cve-check,
        docker,
        mermaid-lint,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any upstream job failed
        if: contains(needs.*.result, 'failure')
        run: |
          echo "One or more jobs failed"
          exit 1

      - name: Fail if any upstream job was cancelled
        if: contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more jobs were cancelled"
          exit 1

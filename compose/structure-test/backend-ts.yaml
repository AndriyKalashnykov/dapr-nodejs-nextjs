# container-structure-test: asserts the backend-ts image's Dockerfile contract
# (independent of runtime behaviour, which the smoke test + e2e cover).
# Run via `make image-test SERVICE=backend-ts IMAGE_TAG=<tag>`.
schemaVersion: 2.0.0

metadataTest:
  # Must match the Dockerfile EXPOSE (via APP_INTERNAL_PORT) and the app's bind port.
  exposedPorts:
    - "3001"
  # Non-root: the runtime stage drops to `USER node`. A reset to root here fails.
  user: "node"
  workdir: "/app"
  # Must match the runtime CMD — drift = container starts the wrong process.
  cmd:
    - "./node_modules/.bin/tsx"
    - "--import"
    - "./src/lib/instrumentation.ts"
    - "src/main.ts"

fileExistenceTests:
  - name: app entrypoint present
    path: /app/src/main.ts
    shouldExist: true
  - name: tsx launcher present
    path: /app/node_modules/.bin/tsx
    shouldExist: true
  # npm/corepack are stripped in the runtime stage (attack-surface reduction) —
  # assert they're gone so a base-image change can't silently reintroduce them.
  - name: npm removed from runtime image
    path: /usr/local/bin/npm
    shouldExist: false

commandTests:
  - name: node runtime is v24
    command: node
    args: ["--version"]
    expectedOutput:
      - "(?m)^v24\\."
